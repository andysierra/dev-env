; flameshot — captura de área con Super+Shift+S (reemplaza grim + slurp + swappy de la bitácora CachyOS)
; Flujo: seleccionar área → anotar encima → Enter o Ctrl+C copia al clipboard (queda en Alt+V) · Ctrl+S guarda.
; savePath no se define: el default es la carpeta de imágenes XDG (~/Imágenes). Escribirla a mano
; rompe la config: Qt no lee bien la "á" cruda en el .ini → diálogo "Resolve configuration errors".
[General]
disabledTrayIcon=true
showStartupLaunchMessage=false
showDesktopNotification=false
showHelp=false
checkForUpdates=false
savePathFixed=false
filenamePattern=captura_%F_%H-%M-%S
saveAfterCopy=false
copyPathAfterSave=false
