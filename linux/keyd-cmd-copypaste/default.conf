# /etc/keyd/default.conf
#
# Alt como "Cmd" para Copiar/Pegar (estilo macOS), en todas las apps.
# Alt+Shift+S NO va aca: es un keybind de labwc (rc.xml), no de keyd,
# porque lanzar un screenshot es una accion del compositor, no una tecla
# a remapear.
#
# "alt" es un nombre de layer reconocido por keyd (corresponde a
# leftalt/rightalt automaticamente, sin necesidad de "= layer(alt)" en
# [main]). Las teclas NO listadas dentro de [alt] pasan a la app tal cual
# Alt+tecla: por eso Alt+Tab, Alt+F4, Alt+Q, Alt+Space, etc. siguen
# funcionando sin tocarlos aca.

[ids]
*

[main]

[alt]
c = C-c
v = C-v
